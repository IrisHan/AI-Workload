[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workload-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "huggingface-hub>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
app = ["data/*.json"]
"app.lib.spec_studio" = ["glossary.yaml"]
"app.hardware" = ["data/*.json"]
"app.hardware.architecture" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
